<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodTrail - Your Daily Visual Mood Journey</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', sans-serif;
            background: #1a1a1a;
            color: #fff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .mood-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }
        .mood-tile {
            aspect-ratio: 1;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .mood-tile:hover {
            transform: scale(1.05);
        }
        .streak-banner {
            background: linear-gradient(45deg, #FF6B6B, #4ECDC4);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
        .share-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(45deg, #FF6B6B, #4ECDC4);
            padding: 15px;
            border-radius: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .achievement-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.95);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            color: #1a1a1a;
            display: none;
            z-index: 1000;
            animation: popIn 0.5s ease;
        }
        @keyframes popIn {
            from { transform: translate(-50%, -50%) scale(0); }
            to { transform: translate(-50%, -50%) scale(1); }
        }
        .mood-stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .stat-card {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            min-width: 150px;
            margin: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="streak-banner">
            <h2>🔥 5 Day Streak! Keep it up!</h2>
            <p>Share your streak to get bonus points!</p>
        </div>
        
        <div class="mood-stats">
            <div class="stat-card">
                <h3>Mood Score</h3>
                <p>87/100</p>
            </div>
            <div class="stat-card">
                <h3>Streak</h3>
                <p>5 days</p>
            </div>
            <div class="stat-card">
                <h3>Rank</h3>
                <p>#234 in your city</p>
            </div>
        </div>

        <div class="mood-grid" id="moodGrid"></div>

        <div class="share-container">
            <button onclick="shareAchievement()">📱 Share Your Mood Journey</button>
        </div>
    </div>

    <div class="achievement-popup" id="achievementPopup">
        <h2>🎉 Achievement Unlocked!</h2>
        <p>"Mood Master" - Track your mood for 5 days straight</p>
        <button onclick="closePopup()">Claim 500 Points</button>
    </div>

    <script>
        // Generate mood tiles with random gradients
        const moodGrid = document.getElementById('moodGrid');
        const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEEAD', '#D4A5A5'];

        for (let i = 0; i < 30; i++) {
            const tile = document.createElement('div');
            tile.className = 'mood-tile';
            const color1 = colors[Math.floor(Math.random() * colors.length)];
            const color2 = colors[Math.floor(Math.random() * colors.length)];
            tile.style.background = `linear-gradient(45deg, ${color1}, ${color2})`;
            tile.addEventListener('click', () => showAchievement());
            moodGrid.appendChild(tile);
        }

        // Gamification features
        function showAchievement() {
            const popup = document.getElementById('achievementPopup');
            popup.style.display = 'block';
        }

        function closePopup() {
            const popup = document.getElementById('achievementPopup');
            popup.style.display = 'none';
        }

        function shareAchievement() {
            if (navigator.share) {
                navigator.share({
                    title: 'My MoodTrail Journey',
                    text: '🎉 I'm on a 5-day mood tracking streak! Join me on MoodTrail and let\'s track our mental wellness together! 🌟',
                    url: window.location.href
                });
            }
        }

        // Show achievement popup after 3 seconds
        setTimeout(showAchievement, 3000);
    </script>
</body>
</html>
